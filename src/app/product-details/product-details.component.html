<div class="card h-100 shadow-sm">
  <img [src]="(product.image)?product.image:'assets/images/no-image.png'" class="card-img-top p-3" alt="{{product.name}}">
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{product.name}}</h5>
    <p class="card-text mb-1">Price: {{product.price | currency}}</p>
    <p class="card-text mb-1">Quantity: {{product.quantity}}</p>
    <p class="card-text">Code: {{product.code}}</p>
    <!-- Si vous voulez ajouter un bouton, par exemple: -->
    <!-- <a href="#" class="btn btn-primary mt-auto">View Details</a> -->
  </div>
</div>
